<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna & Pierre</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            text-align: center;
            background-color: #fdfcfafc;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            margin: 0;
        }
        h1 {
            font-size: 3.5em;
            color: #b8905b;
            margin-bottom: 5px;
            margin-top: 5px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .date-box {
            font-size: 1.5em;
            font-weight: bold;
            margin: 30px 0;
            padding: 15px 40px;
            border: 2px solid #b8905b;
            border-radius: 8px;
            display: inline-block;
            background-color: white;
        }
        .footer-text {
            font-style: italic;
            color: #666;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <p>Wij gaan trouwen!</p>
    <h1>Hanna & Pierre</h1>

    <div class="date-box">
        Zaterdag 12 Juni 2027
    </div>

    <p>Locatie: Antwerpen</p>
    
    <p class="footer-text">Save the date! <br>De officiële uitnodiging met alle details volgt later.</p>

</body>
</html>
