<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna &amp; Pierre</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #2c2c2c;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        /* Toont de VOLLEDIGE tekening bovenaan */
        .hero-img {
            width: 92%;
            max-width: 750px;
            height: auto;
            display: block;
            margin: 25px auto 0 auto;
        }

        .wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 20px 50px 20px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #1b365d; /* Klassiek blauw */
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        /* De namen met een "punchy" Aperol-oranje kleur */
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 5em;
            color: #f26522; /* Lekker knallend oranje! */
            margin: 5px 0 10px 0;
            font-weight: normal;
            line-height: 1.1;
        }

        /* Strak lijntje in plaats van het sterretje */
        .divider {
            width: 60px;
            height: 2px;
            background-color: #1b365d;
            margin: 15px auto 30px auto;
        }

        .date-container {
            margin: 0 0 40px 0;
            padding: 0;
        }

        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            font-style: italic;
            font-weight: 600;
            color: #1b365d;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .location-label {
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #1b365d;
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .location-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: #2c2c2c;
            margin: 0 0 35px 0;
            font-weight: 400;
        }

        /* Sfeerfoto met boog-vorm */
        .arch-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 175px 175px 12px 12px;
            border: 2px solid #1b365d;
            display: block;
            margin: 10px auto 30px auto;
        }

        .footer-note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2em;
            color: #555555;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Kasteel 3 foto -->
    <img src="kasteel3.jpeg" alt="Kasteel van Kapellen Schets" class="hero-img">

    <div class="wrapper">
        <div class="subtitle">Save the Date</div>
        
        <!-- Namen in het oranje -->
        <h1 class="names">Hanna &amp; Pierre</h1>

        <!-- Het sterretje is vervangen door het strakke lijntje (.divider) -->
        <div class="divider"></div>

        <div class="date-container">
            <div class="date-text">27 augustus 2027</div>
        </div>

        <div>
            <span class="location-label">Locatie</span>
            <h2 class="location-title">Kasteel van Kapellen</h2>
        </div>

        <!-- De tweede foto onderaan -->
        <img src="hannaenpierre.jpeg" alt="Hanna &amp; Pierre" class="arch-img">

        <p class="footer-note">
            Wij gaan trouwen!<br>
            De officiële uitnodiging met alle details volgt later.
        </p>
    </div>

</body>
</html>
