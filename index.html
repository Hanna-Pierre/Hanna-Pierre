<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna &amp; Pierre</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #fcf9f2;
            color: #2c2c2c;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        /* Bannerafbeelding van het kasteel */
        .hero-img {
            width: 100%;
            height: 380px;
            max-height: 48vh;
            object-fit: cover;
            object-position: center;
            display: block;
            border-bottom: 3px solid #d4af37;
        }

        /* Inhoudscontainer */
        .wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8c733e;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 4em;
            color: #c5a059;
            margin: 5px 0 15px;
            font-weight: normal;
        }

        .divider {
            margin: 20px auto;
            width: 80px;
            height: 2px;
            background-color: #d4af37;
        }

        .date-box {
            background-color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px 35px;
            display: inline-block;
            margin: 10px 0 25px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
        }

        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            font-weight: 600;
            color: #2c2c2c;
            letter-spacing: 2px;
        }

        .location-label {
            font-size: 0.8em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8c733e;
            display: block;
            margin-bottom: 5px;
        }

        .location-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            color: #2c2c2c;
            margin: 0 0 25px;
            font-weight: 400;
        }

        /* Sfeerfoto boog-vorm */
        .arch-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 175px 175px 12px 12px;
            border: 3px solid #d4af37;
            display: block;
            margin: 10px auto 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .footer-note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1em;
            color: #555555;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <img src="kasteel.jpg" alt="Kasteel van Kapellen" class="hero-img">

    <div class="wrapper">
        <div class="subtitle">Save the Date</div>
        <h1 class="names">Hanna &amp; Pierre</h1>

        <div class="divider"></div>

        <div class="date-box">
            <div class="date-text">27/08/2027</div>
        </div>

        <div>
            <span class="location-label">Locatie</span>
            <h2 class="location-title">Kasteel van Kapellen</h2>
        </div>

        <img src="interieur.webp" alt="Interieur Kasteel van Kapellen" class="arch-img">

        <p class="footer-note">
            Wij gaan trouwen!<br>
            De officiële uitnodiging met alle details volgt later.
        </p>
    </div>

</body>
</html>
