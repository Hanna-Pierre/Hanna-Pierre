<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna &amp; Pierre</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-color: #b8905b; /* Chique warm goud */
            --text-dark: #2c2c2c;
            --bg-color: #ffffff; /* Strak wit */
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        /* Banner foto kasteel */
        .hero-img {
            width: 100%;
            height: 380px;
            max-height: 48vh;
            object-fit: cover;
            object-position: center;
            display: block;
            border-bottom: 3px solid var(--accent-color);
        }

        /* Inhoudscontainer */
        .wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 5em;
            color: var(--accent-color);
            margin: 5px 0 10px;
            font-weight: normal;
            line-height: 1.1;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px auto 25px;
            color: var(--accent-color);
            font-size: 0.9em;
        }

        .line {
            height: 1px;
            width: 70px;
            background-color: var(--accent-color);
        }

        /* Vrije datum zonder kader */
        .date-container {
            margin: 30px 0 40px;
            padding: 0;
        }

        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em; /* Extra groot formaat */
            font-style: italic;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .location-label {
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .location-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: var(--text-dark);
            margin: 0 0 35px;
            font-weight: 400;
        }

        /* Sfeerfoto boog-vorm */
        .arch-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 175px 175px 12px 12px;
            border: 3px solid var(--accent-color);
            display: block;
            margin: 10px auto 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .footer-note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2em;
            color: #555555;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <img src="kasteel.jpg" alt="Kasteel van Kapellen" class="hero-img">

    <div class="wrapper">
        <div class="subtitle">Save the Date</div>
        <h1 class="names">Hanna &amp; Pierre</h1>

        <div class="divider">
            <span class="line"></span>
            <span>✨</span>
            <span class="line"></span>
        </div>

        <div class="date-container">
            <div class="date-text">27 augustus 2027</div>
        </div>

        <div>
            <span class="location-label">Locatie</span>
            <h2 class="location-title">Kasteel van Kapellen</h2>
        </div>

        <img src="interieur.webp" alt="Interieur Kasteel van Kapellen" class="arch-img">

        <p class="footer-note">
            Wij gaan trouwen!<br>
            De officiële uitnodiging met alle details volgt later.
        </p>
    </div>

</body>
</html>
