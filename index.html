<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna & Pierre</title>
    
    <!-- Google Fonts voor een chique en feestelijke uitstraling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            /* Feestelijke warm-champagne verloopachtergrond */
            background: linear-gradient(180deg, #fdfbf7 0%, #f4eae1 100%);
            color: #2c2c2c;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Banner van het Kasteel van Kapellen */
        .hero-image {
            width: 100%;
            height: 48vh;
            object-fit: cover;
            object-position: center;
            border-bottom: 3px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sub-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #8c733e;
            margin-bottom: 0;
        }

        /* Feestelijke sierletters voor de namen */
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5em;
            color: #c5a059;
            margin: 5px 0 15px;
            font-weight: normal;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Feestelijk scheidingslijntje */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 10px 0 25px;
            color: #d4af37;
            font-size: 1.1em;
        }
        
        .line {
            height: 1px;
            width: 60px;
            background-color: #d4af37;
        }

        /* Datum-kaartje */
        .date-card {
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 16px 40px;
            margin: 15px 0 25px;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
            display: inline-block;
        }

        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            font-weight: 600;
            color: #2c2c2c;
            letter-spacing: 3px;
        }

        .location {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            color: #333;
            margin: 10px 0 30px;
        }

        .location-label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75em;
            color: #8c733e;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* Sfeerfoto met boog-vorm en gouden rand */
        .interior-image {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 190px 190px 15px 15px;
            border: 3px solid #d4af37;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            margin: 15px 0 35px;
        }

        .footer-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.15em;
            color: #555;
            margin-top: 10px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- Kasteelfoto -->
    <img src="kasteel.jpg" alt="Kasteel van Kapellen" class="hero-image">

    <div class="container">
        <p class="sub-title">Save the Date</p>
        <h1 class="names">Hanna & Pierre</h1>

        <div class="divider">
            <span class="line"></span>
            <span>✨</span>
            <span class="line"></span>
        </div>

        <div class="date-card">
            <div class="date-text">27/08/2027</div>
        </div>

        <div class="location">
            <span class="location-label">Locatie</span>
            Kasteel van Kapellen
        </div>

        <!-- Sfeerfoto zaal -->
        <img src="interieur.webp" alt="Sfeerbeeld Kasteel van Kapellen" class="interior-image">

        <p class="footer-text">
            Wij gaan trouwen! <br>
            De officiële uitnodiging met alle details volgt later.
        </p>
    </div>

</body>
</html>
