<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Save the Date | Hanna &amp; Pierre</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /* Nieuwe warme kleuren passend bij de oranje schets */
            --primary-color: #a84322; /* Warme roest/terracotta voor namen en datum */
            --accent-color: #e26d43;  /* Lichter oranje voor details zoals de lijn en subtitel */
            --text-dark: #3b332f;     /* Donker warmgrijs/bruin voor de rest van de tekst */
            --bg-color: #fffdfa;      /* Een héél zacht warme witte achtergrond */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }

        /* Banner foto */
        .hero-img {
            width: 92%;
            max-width: 750px;
            height: auto;
            display: block;
            margin: 25px auto 0 auto;
            /* Lichte oranje rand onder de foto om het af te werken */
            border-bottom: 2px solid var(--accent-color);
        }

        .wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 20px 50px 20px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.1em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 5em;
            color: var(--primary-color);
            margin: 5px 0 10px 0;
            font-weight: normal;
            line-height: 1.1;
        }

        .divider {
            margin: 15px auto 25px auto;
            color: var(--accent-color);
            font-size: 0.9em;
        }

        .date-container {
            margin: 30px 0 40px 0;
            padding: 0;
        }

        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            font-style: italic;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .location-label {
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .location-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: var(--text-dark);
            margin: 0 0 35px 0;
            font-weight: 400;
        }

        /* Sfeerfoto met boog-vorm */
        .arch-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 175px 175px 12px 12px;
            border: 2px solid var(--accent-color);
            display: block;
            margin: 10px auto 30px auto;
        }

        .footer-note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2em;
            color: #6b5c55;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Kasteel banner -->
    <img src="kasteel2.jpeg" alt="Kasteel van Kapellen" class="hero-img">

    <div class="wrapper">
        <div class="subtitle">Save the Date</div>
        <h1 class="names">Hanna &amp; Pierre</h1>

        <div class="divider">✨</div>

        <div class="date-container">
            <div class="date-text">27 augustus 2027</div>
        </div>

        <div>
            <span class="location-label">Locatie</span>
            <h2 class="location-title">Kasteel van Kapellen</h2>
        </div>

        <!-- Sfeerfoto met nieuwe bestandsnaam -->
        <img src="hannaenpierre.jpeg" alt="Hanna en Pierre" class="arch-img">

        <p class="footer-note">
            Wij gaan trouwen!<br>
            De officiële uitnodiging met alle details volgt later.
        </p>
    </div>

</body>
</html>
