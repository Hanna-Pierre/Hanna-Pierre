<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save the Date – Hanna & Pierre</title>
  <meta name="description" content="Hanna & Pierre trouwen op 27 augustus 2027 in Kasteel van Kapellen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f7f5f0;
      --ink: #2b3f80;      /* blauw van de kasteeltekening */
      --sage: #7a9577;     /* groen van de salon */
      --gold: #b8924a;
      --text: #3a3f55;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ivory);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.25rem;
      line-height: 1.6;
      text-align: center;
    }

    /* Banner: het hele kasteel zichtbaar */
    .banner img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      margin: 0 auto;
    }

    /* Tekstblok */
    .invite {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3.5rem;
    }

    .save {
      font-family: "Pinyon Script", cursive;
      font-weight: 400;            /* geen vet: voorkomt de "dikke" look */
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      line-height: 1.1;
      color: var(--sage);
    }

    .names {
      font-family: "Pinyon Script", cursive;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 6.5rem);
      line-height: 1.2;
      color: var(--ink);
      margin: 1.2rem 0 1.5rem;
    }

    .divider {
      width: 6rem;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 1.5rem;
    }

    .date {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .place {
      font-style: italic;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      margin-top: 0.3rem;
    }

    .more {
      margin-top: 2rem;
      font-size: 1.15rem;
      color: var(--sage);
    }

    /* Foto */
    .photos {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      max-width: 62rem;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .arch {
      position: relative;
      padding: 8px;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 0 0;   /* boogvorm */
    }

    .arch img {
      display: block;
      width: 100%;
      object-fit: cover;
      border-radius: 999px 999px 0 0;
    }

    .arch.big { width: min(26rem, 100%); }
    .arch.big img { aspect-ratio: 3 / 4.2; }

    footer {
      padding: 0 1.5rem 3rem;
      font-family: "Pinyon Script", cursive;
      font-size: 2rem;
      color: var(--gold);
    }

    @media (max-width: 600px) {
      .photos { padding-bottom: 3rem; }
    }
  </style>
</head>
<body>

  <header class="banner">
    <img src="kasteel.jpeg" alt="Tekening van Kasteel van Kapellen">
  </header>

  <main>
    <section class="invite">
      <h1 class="save">Save the Date</h1>
      <p class="names">Hanna &amp; Pierre</p>
      <div class="divider"></div>
      <p class="date">27 augustus 2027</p>
      <p class="place">Kasteel van Kapellen</p>
      <p class="more">Een formele uitnodiging volgt later.</p>
    </section>

    <section class="photos">
      <div class="arch big">
        <img src="interieur.webp" alt="Feestzaal met kristallen luchters in Kasteel van Kapellen" loading="lazy">
      </div>
    </section>
  </main>

  <footer>Wij hopen jullie daar te zien!</footer>

</body>
</html>
